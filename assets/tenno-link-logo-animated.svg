<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Tenno Link logo">
  <style>
    .orbit{transform-origin:64px 64px;animation:orbit 12s linear infinite}
    .core{transform-origin:64px 64px;animation:core 3.6s ease-in-out infinite}
    .trace{stroke-dasharray:28 305;transform-origin:64px 64px;animation:trace 7s linear infinite}
    @keyframes orbit{from{transform:rotate(-17deg)}to{transform:rotate(343deg)}}
    @keyframes core{0%,100%{opacity:.7;transform:scale(.85)}50%{opacity:1;transform:scale(1.25)}}
    @keyframes trace{to{transform:rotate(-360deg)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76f2ef"/>
      <stop offset=".58" stop-color="#4db6c0"/>
      <stop offset="1" stop-color="#1d6672"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efd397"/>
      <stop offset=".5" stop-color="#d9b875"/>
      <stop offset="1" stop-color="#76552b"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="53" fill="#07151d" stroke="url(#g)" stroke-width="2.6"/>
  <ellipse class="orbit" cx="64" cy="64" rx="61" ry="20" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".76" transform="rotate(-17 64 64)"/>
  <path d="M64 14 82 42 77 69 64 113 51 69 46 42Z" fill="#081820" stroke="url(#gold)" stroke-width="3.2"/>
  <path d="M64 28 72 47 64 93 56 47Z" fill="none" stroke="url(#g)" stroke-width="5"/>
  <path d="M29 45 49 55 43 87 18 69Z" fill="#0b1c24" stroke="url(#gold)" stroke-width="3"/>
  <path d="M99 45 79 55 85 87 110 69Z" fill="#0b1c24" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="64" cy="64" r="13" fill="#06131a" stroke="url(#g)" stroke-width="3"/>
  <circle class="core" cx="64" cy="64" r="4.5" fill="#76f2ef"/>
  <circle cx="4" cy="64" r="3.4" fill="#d9b875"/>
  <circle cx="124" cy="64" r="3.4" fill="#d9b875"/>
<circle class="trace" cx="64" cy="64" r="53" fill="none" stroke="#fff0c8" stroke-width="2.8" stroke-linecap="round" opacity=".85"/></svg>
