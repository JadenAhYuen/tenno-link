<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061018"/><stop offset="1" stop-color="#081923"/></linearGradient>
  <style>
    .t{font-family:Segoe UI,Inter,sans-serif;fill:#eefafa}
    .m{font-family:Segoe UI,Inter,sans-serif;fill:#7f9ba0}
    .c{fill:#76f2ef}.g{fill:#d9b875}
    .box{fill:#0a1d26;stroke:#244c56;stroke-width:2}
    .line{stroke:#76f2ef;stroke-opacity:.55;stroke-width:2;fill:none}
    .goldline{stroke:#d9b875;stroke-opacity:.5;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1200" height="560" rx="24" fill="url(#bg)"/>
<text x="56" y="66" class="t" font-size="28" font-weight="700">🛰️ TENNO LINK DATA FLOW</text>
<text x="56" y="94" class="m" font-size="15">Local-first architecture • profile data stays in the browser unless the user copies it</text>

<rect x="70" y="155" width="230" height="120" rx="18" class="box"/>
<text x="185" y="195" text-anchor="middle" class="c" font-size="16" font-weight="700">WARFRAME.COM</text>
<text x="185" y="224" text-anchor="middle" class="t" font-size="18">gid cookie</text>
<text x="185" y="251" text-anchor="middle" class="m" font-size="13">read locally</text>

<rect x="485" y="135" width="230" height="160" rx="18" class="box"/>
<text x="600" y="178" text-anchor="middle" class="c" font-size="16" font-weight="700">TENNO LINK</text>
<text x="600" y="210" text-anchor="middle" class="t" font-size="17">Profile normalization</text>
<text x="600" y="236" text-anchor="middle" class="t" font-size="17">Inventory extraction</text>
<text x="600" y="262" text-anchor="middle" class="t" font-size="17">Local cache</text>

<rect x="900" y="155" width="230" height="120" rx="18" class="box"/>
<text x="1015" y="195" text-anchor="middle" class="g" font-size="16" font-weight="700">AI BRIDGE</text>
<text x="1015" y="224" text-anchor="middle" class="t" font-size="18">Copy on demand</text>
<text x="1015" y="251" text-anchor="middle" class="m" font-size="13">user chooses destination</text>

<path d="M300 215H485" class="line"/>
<path d="M715 215H900" class="goldline"/>
<polygon points="474,209 486,215 474,221" class="c"/>
<polygon points="889,209 901,215 889,221" class="g"/>

<rect x="245" y="365" width="270" height="115" rx="18" class="box"/>
<text x="380" y="404" text-anchor="middle" class="c" font-size="16" font-weight="700">DIGITAL EXTREMES PROFILE</text>
<text x="380" y="433" text-anchor="middle" class="t" font-size="17">Player progression JSON</text>
<text x="380" y="458" text-anchor="middle" class="m" font-size="13">requested directly by extension</text>

<rect x="685" y="365" width="270" height="115" rx="18" class="box"/>
<text x="820" y="404" text-anchor="middle" class="c" font-size="16" font-weight="700">WFCD / WARFRAMESTAT.US</text>
<text x="820" y="433" text-anchor="middle" class="t" font-size="17">World state + item metadata</text>
